map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    # PORT and BACKEND_URL come from the environment (nginx image envsubst):
    # docker-compose sets 80 and http://backend:8000, Railway its own (docs/DEPLOY.md)
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_set_header Host $host;
        # WebSocket stream of live simulator sessions (/api/sim/sessions/{id}/stream).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # the site's entry page (frontend/public/landing.html, built from the designer's bundle)
    location = / {
        try_files /landing.html =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
