[project]
name = "astrocrop"
version = "0.1.0"
description = "Simulator of crop growth on other planets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "polars>=1.5",
    "duckdb>=1.0",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.14",
    "pint>=0.24",
    "astropy>=6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=4.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
